name: Compilar APK Uyariy

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Herramientas del sistema y Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
               zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          pip install buildozer cython==0.29.36

      - name: Caché de Buildozer (acelera las siguientes compilaciones)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Compilar el APK
        run: python ci_build.py

      - name: Guardar el APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: uyariy-apk
          path: bin/*.apk
